[project]
name = "harness-research-harnesses"
version = "0.1.0"
description = "verifiers harness plugins for the harness-research ladder: Pi with duals, Prime Agent with its switches"
requires-python = ">=3.11"
# verifiers comes from the eval environment these plugins are installed into.
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pi_ladder", "prime_switches"]
